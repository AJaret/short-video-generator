# Servicios del canal. Uso habitual del servicio video (desde la raíz del repo):
#   docker compose build video
#   docker compose run --rm video npm install          # primera vez o al cambiar package.json
#   docker compose up video                            # Remotion Studio en http://localhost:3000
#   docker compose run --rm video npx remotion still ep00-prueba out/portada.png --frame=0

# Nombre fijo del proyecto: las imágenes se llaman reels-generator-<servicio> aunque el repo se
# clone en otra carpeta (el servicio analisis reutiliza la imagen de voz por ese nombre).
name: reels-generator

services:
  video:
    build: ./video
    working_dir: /repo/video
    volumes:
      - ./:/repo
      # node_modules en volumen propio: leerlo desde el disco de Windows sería muy lento
      - video_node_modules:/repo/video/node_modules
    ports:
      - "3000:3000"
    environment:
      # Los cambios hechos desde Windows no generan eventos inotify en el contenedor
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: npx remotion studio --port=3000 --no-open

  # Estudio de voz: Chatterbox (TTS) + Whisper (tiempos por palabra), con la GPU.
  #   docker compose run --rm voz python voz/generar.py --guion episodios/<ep>/guion.md --salida episodios/<ep>/
  #   docker compose up -d voz                         # interfaz de pruebas en http://localhost:7860
  voz:
    build: ./voz
    image: reels-generator-voz
    working_dir: /repo
    volumes:
      - ./:/repo
      # caché de modelos (Hugging Face + Whisper): se descargan una sola vez
      - modelos_voz:/root/.cache
    ports:
      - "7860:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python voz/app.py

  # Análisis de los MP4 (herramientas/informe.py, lo llama producir.py): la MISMA imagen que voz
  # (ffmpeg completo, numpy, PIL, pyloudnorm, librosa), pero sin reservar la GPU ni el puerto 7860,
  # porque no carga ningún modelo. Así el informe no choca con la interfaz de voz abierta.
  #   docker compose run --rm analisis python herramientas/informe.py episodios/<ep>/<ep>.mp4 --carpeta episodios/<ep>/stills
  # Perfil propio: `docker compose up` no lo arranca; `docker compose run analisis …` sí.
  analisis:
    image: reels-generator-voz
    build: ./voz
    profiles: [herramientas]
    working_dir: /repo
    volumes:
      - ./:/repo

volumes:
  video_node_modules:
  modelos_voz:
